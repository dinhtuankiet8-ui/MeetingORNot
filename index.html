<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save The Princess!</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600&family=Be+Vietnam+Pro:wght@500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a1a;color:#e2e8f0;font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;overflow-x:hidden}
.screen{display:none;width:100%;max-width:680px}
.screen.active{display:block}

/* ── CHAR SELECT ── */
.ptitle{font-family:'Press Start 2P',monospace;font-size:10px;color:#a78bfa;text-shadow:0 0 20px rgba(167,139,250,0.7);line-height:2;margin-bottom:0.4rem;text-align:center}
.psub{font-family:'Press Start 2P',monospace;font-size:6px;color:#f59e0b;margin-bottom:2rem;text-align:center;letter-spacing:0.1em}
.char-row{display:flex;gap:1.25rem;justify-content:center;margin-bottom:1.5rem;flex-wrap:wrap}
.ccard{background:#1e1e3a;border:2px solid #3b3b6e;border-radius:16px;padding:1.25rem 1.5rem;cursor:pointer;flex:1;min-width:190px;max-width:240px;text-align:center;transition:all 0.2s;user-select:none}
.ccard:hover{border-color:#a78bfa;transform:translateY(-4px);box-shadow:0 8px 32px rgba(167,139,250,0.25)}
.ccard.sel{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,0.3)}
.cavatar{width:90px;height:90px;border-radius:50%;object-fit:cover;object-position:center top;border:3px solid #3b3b6e;margin:0 auto 0.75rem;display:block;transition:border-color 0.2s}
.ccard.sel .cavatar{border-color:#a78bfa}
.cname{font-family:'Press Start 2P',monospace;font-size:7px;color:#e2e8f0;margin-bottom:0.3rem;line-height:1.8}
.crole{font-size:12px;color:#94a3b8}
.btnstart{width:100%;padding:14px;font-family:'Press Start 2P',monospace;font-size:8px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border:none;border-radius:10px;cursor:pointer;letter-spacing:0.05em;transition:all 0.2s}
.btnstart:disabled{opacity:0.3;cursor:not-allowed}
.btnstart:not(:disabled):hover{opacity:0.88;transform:translateY(-1px)}

/* ── HUD ── */
.hud{display:flex;align-items:center;justify-content:space-between;background:#1e1e3a;border:1px solid #3b3b6e;border-radius:12px;padding:10px 14px;margin-bottom:1rem}
.hud-l{display:flex;align-items:center;gap:10px}
.hudav{width:36px;height:36px;border-radius:50%;object-fit:cover;object-position:center top;border:2px solid #a78bfa}
.hudname{font-family:'Press Start 2P',monospace;font-size:6px;color:#a78bfa;line-height:1.8}
.hud-r{text-align:right}
.hudstage{font-family:'Press Start 2P',monospace;font-size:6px;color:#f59e0b;margin-bottom:5px}
.progtrack{height:10px;background:#111;border-radius:5px;width:140px;overflow:hidden;border:1px solid #3b3b6e}
.progfill{height:100%;background:linear-gradient(90deg,#7c3aed,#a78bfa);border-radius:5px;transition:width 0.6s ease}

/* ── CHASE CANVAS ── */
.chase-wrap{position:relative;width:100%;height:200px;border-radius:16px;overflow:hidden;margin-bottom:1rem;border:1px solid #3b3b6e}
.chase-wrap canvas{width:100%;height:100%;display:block}
.pspeech{position:absolute;top:8px;right:10px;background:#1e1e3a;border:2px solid #a78bfa;border-radius:10px;padding:8px 12px;font-family:'Be Vietnam Pro',sans-serif;font-size:13px;font-weight:600;color:#a78bfa;line-height:1.6;opacity:0;transition:opacity 0.3s;pointer-events:none;max-width:190px;text-align:center}
.pspeech.show{opacity:1}
.pspeech::after{content:'';position:absolute;bottom:-8px;right:16px;border:4px solid transparent;border-top-color:#a78bfa}

/* ── QUESTION ── */
.qbox{background:#1e1e3a;border:1px solid #3b3b6e;border-radius:16px;padding:1.25rem;margin-bottom:0.75rem}
.qtag{font-family:'Press Start 2P',monospace;font-size:5px;color:#a78bfa;margin-bottom:0.75rem;letter-spacing:0.1em}
.qtext{font-size:14px;color:#e2e8f0;line-height:1.7;margin-bottom:1rem}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:11px 15px;background:#111827;border:1px solid #3b3b6e;border-radius:10px;font-size:13px;color:#e2e8f0;cursor:pointer;transition:all 0.15s;line-height:1.5;width:100%}
.opt:hover:not(:disabled){background:#1f2937;border-color:#a78bfa}
.opt.correct{background:rgba(34,197,94,0.12);border-color:#22c55e;color:#86efac}
.opt.wrong{background:rgba(239,68,68,0.12);border-color:#ef4444;color:#fca5a5}
.opt:disabled{cursor:not-allowed}
.feedback{font-size:13px;padding:10px 14px;border-radius:10px;margin-bottom:0.75rem;line-height:1.6;display:none}
.feedback.show{display:block}
.feedback.ok{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:#86efac}
.feedback.bad{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#fca5a5}
.btnnext{width:100%;padding:12px;font-family:'Press Start 2P',monospace;font-size:7px;background:#111827;border:1px solid #a78bfa;border-radius:10px;color:#a78bfa;cursor:pointer;transition:all 0.15s;display:none}
.btnnext.show{display:block}
.btnnext:hover{background:rgba(167,139,250,0.1)}

/* ── WIN ── */
#sWin{text-align:center;padding:1rem}
.wintitle{font-family:'Press Start 2P',monospace;font-size:9px;color:#f59e0b;text-shadow:0 0 20px #f59e0b;line-height:2;margin-bottom:1rem}
.winbubble{background:#1e1e3a;border:2px solid #a78bfa;border-radius:16px;padding:1.25rem;max-width:380px;margin:0 auto 0.5rem;position:relative}
.winbubble p{font-family:'Be Vietnam Pro',sans-serif;font-size:16px;font-weight:600;color:#a78bfa;line-height:1.8;text-align:center}
.winbubble::after{content:'';position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#a78bfa}
.princess{font-size:52px;margin-top:0.75rem;display:block}
.btnrestart{margin-top:1.25rem;padding:11px 28px;font-family:'Press Start 2P',monospace;font-size:6px;background:transparent;border:1px solid #3b3b6e;border-radius:10px;color:#94a3b8;cursor:pointer;transition:all 0.15s}
.btnrestart:hover{border-color:#a78bfa;color:#a78bfa}
</style>
</head>

  <button class="btnnext" id="btnNext" onclick="nextQ()">KEEP CHASING →</button>
</div>

<!-- WIN -->
<div id="sWin" class="screen">
  <div class="wintitle">🎉 PRINCESS SAVED! 🎉</div>
  <div class="chase-wrap" style="margin-bottom:1.25rem">
    <canvas id="winCanvas"></canvas>
  </div>
  <div class="winbubble">
    <p>"Hôm nay skip meeting<br>nha hoàng tử ngốc 😘"</p>
  </div>
  <span class="princess">👸</span>
  <br>
  <button class="btnrestart" onclick="doRestart()">▶ PLAY AGAIN</button>
</div>

<script>
// ── IMAGES (read from preloaded DOM elements) ──
var SRCS = [];

window.addEventListener('load', function() {
  SRCS[0] = document.getElementById('pi1').src;
  SRCS[1] = document.getElementById('pi2').src;
  document.getElementById('av0').src = SRCS[0];
  document.getElementById('av1').src = SRCS[1];
});

// ── QUESTIONS ──
var QS = [
  {q:"Universal Containers wants to implement a recruiting app with a custom Application and Position object. Each position may have many applications. What ensures applications are retained even if the position is removed?",
   opts:["Create a lookup field on Position","Create a master-detail field on Applicant","Create a lookup field on Applicant","Create a master-detail field on Position"],
   ans:2, exp:"A lookup field on Applicant lets application records survive even if the parent Position is deleted."},
  {q:"Ursa Major Solar's admin configured multiple record-triggered flows to run before or after save on the Account object. What should the admin consider about execution order?",
   opts:["Assign the highest priority to the flow that should execute first","The flow with the longest execution time will execute first","The flow with the shortest execution time will execute first","The order in which those flows are executed is not guaranteed"],
   ans:3, exp:"When multiple record-triggered flows exist on the same object and trigger, execution order is not guaranteed."},
  {q:"AW Computing users share a single page layout but Customer Service and Sales users complain about seeing irrelevant actions. What should the admin recommend?",
   opts:["Use Dynamic Actions and conditional visibility to show the appropriate actions","Create separate record types for Customer Service and Sales records","Configure two separate permission sets","Make two separate Lightning record pages"],
   ans:0, exp:"Dynamic Actions with conditional visibility controls which buttons appear per user without duplicating pages."},
  {q:"At Cloud Kicks, the Sales team uses a specific dashboard daily and wants an easier way to see it. What should the admin recommend?",
   opts:["Add the dashboard to the Sales team home page","Create a custom app with a dashboard","Email the dashboard to the Sales Team every morning","Update the Sales team app with a new dashboard"],
   ans:0, exp:"Adding the dashboard to the home page gives the Sales team instant visibility every time they log in."},
  {q:"The sales team at Universal Containers needs the Account checkbox 'Opportunity Created' automatically checked when a related Opportunity is created. What feature should the admin use?",
   opts:["Record-triggered flow","Workflow rule","Assignment rule","Screen flow"],
   ans:0, exp:"A record-triggered flow on the Opportunity can update a related Account field when a new Opportunity is created."}
];

// ── STATE ──
var chosenHero = -1;
var qIdx = 0;
var answered = false;
var animId = null;
var winAnimId = null;
var bounceT = 0;
var progTarget = 0;
var progCurrent = 0;
var shakeFrames = 0;

// ── HERO IMG OBJECT for canvas ──
var heroCanvasImg = new Image();

// ── SCREENS ──
function showScreen(id) {
  var screens = document.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
}

// ── CHARACTER SELECT ──
function pickHero(idx) {
  chosenHero = idx;
  document.getElementById('cc0').classList.toggle('sel', idx === 0);
  document.getElementById('cc1').classList.toggle('sel', idx === 1);
  document.getElementById('btnStart').disabled = false;
  heroCanvasImg.src = SRCS[idx];
}

// ── START GAME ──
function startGame() {
  if (chosenHero < 0) return;
  qIdx = 0; answered = false;
  progTarget = 0; progCurrent = 0; bounceT = 0; shakeFrames = 0;
  showScreen('sGame');
  renderQ();
  startChase();
}

// ── RENDER QUESTION ──
function renderQ() {
  answered = false;
  var q = QS[qIdx];
  var src = SRCS[chosenHero];

  document.getElementById('hudAv').src = src;
  document.getElementById('hudName').textContent = chosenHero === 0 ? 'THE PRINCE' : 'THE SHADOW';
  document.getElementById('hudStage').textContent = 'QUESTION ' + (qIdx+1) + ' / 5';
  document.getElementById('progFill').style.width = (qIdx / 5 * 100) + '%';
  document.getElementById('qText').textContent = q.q;

  var optsEl = document.getElementById('opts');
  optsEl.innerHTML = '';
  for (var i = 0; i < q.opts.length; i++) {
    var btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = String.fromCharCode(65 + i) + '. ' + q.opts[i];
    btn.setAttribute('data-i', i);
    btn.onclick = (function(ci){ return function(){ doAnswer(ci); }; })(i);
    optsEl.appendChild(btn);
  }

  var fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.textContent = '';
  var nb = document.getElementById('btnNext');
  nb.className = 'btnnext';
  document.getElementById('pSpeech').classList.remove('show');
}

// ── ANSWER ──
function doAnswer(i) {
  if (answered) return;
  answered = true;
  var q = QS[qIdx];
  var btns = document.querySelectorAll('.opt');
  for (var b = 0; b < btns.length; b++) btns[b].disabled = true;

  var fb = document.getElementById('feedback');
  if (i === q.ans) {
    btns[i].classList.add('correct');
    progTarget = (qIdx + 1) / 5;
    fb.className = 'feedback ok show';
    fb.textContent = '✓ Correct! ' + q.exp;
  } else {
    btns[i].classList.add('wrong');
    btns[q.ans].classList.add('correct');
    shakeFrames = 18;
    var sp = document.getElementById('pSpeech');
    sp.classList.add('show');
    setTimeout(function(){ sp.classList.remove('show'); }, 2800);
    fb.className = 'feedback bad show';
    fb.textContent = '✗ ' + q.exp;
  }
  document.getElementById('btnNext').className = 'btnnext show';
}

// ── NEXT QUESTION ──
function nextQ() {
  qIdx++;
  if (qIdx >= QS.length) {
    cancelAnimationFrame(animId);
    showScreen('sWin');
    progCurrent = 0.5;
    progTarget = 1.0;
    startWinAnim();
  } else {
    renderQ();
  }
}

// ── RESTART ──
function doRestart() {
  cancelAnimationFrame(animId);
  cancelAnimationFrame(winAnimId);
  chosenHero = -1; qIdx = 0; answered = false;
  progTarget = 0; progCurrent = 0; bounceT = 0; shakeFrames = 0;
  document.getElementById('cc0').classList.remove('sel');
  document.getElementById('cc1').classList.remove('sel');
  document.getElementById('btnStart').disabled = true;
  showScreen('sSelect');
}

// ── CANVAS DRAWING ──
function resizeCanvas(c) {
  var w = c.parentElement.clientWidth || 680;
  var h = c.parentElement.clientHeight || 200;
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
}

function lerp(a, b, t) { return a + (b - a) * t; }

function drawScene(canvas, isWin) {
  resizeCanvas(canvas);
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;

  bounceT += 0.13;
  progCurrent = lerp(progCurrent, progTarget, 0.035);

  // Sky
  var sky = ctx.createLinearGradient(0,0,0,H*0.65);
  sky.addColorStop(0,'#08082a'); sky.addColorStop(1,'#1a1a5e');
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);

  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  var stars = [[0.1,0.08],[0.25,0.04],[0.42,0.12],[0.58,0.05],[0.7,0.15],[0.83,0.07],[0.93,0.1],[0.15,0.18],[0.65,0.19]];
  for (var s = 0; s < stars.length; s++) {
    ctx.beginPath(); ctx.arc(stars[s][0]*W, stars[s][1]*H, 1, 0, Math.PI*2); ctx.fill();
  }

  // Moon
  ctx.fillStyle = '#fffde7';
  ctx.beginPath(); ctx.arc(W*0.87, H*0.14, 14, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#0d0d2a';
  ctx.beginPath(); ctx.arc(W*0.9, H*0.12, 11, 0, Math.PI*2); ctx.fill();

  // Ground
  ctx.fillStyle = '#3d2b1f'; ctx.fillRect(0, H*0.65, W, H*0.35);
  ctx.fillStyle = '#2d4a1e'; ctx.fillRect(0, H*0.63, W, H*0.07);

  // Road
  ctx.fillStyle = '#6b4c2a'; ctx.fillRect(0, H*0.68, W, H*0.19);
  ctx.save(); ctx.strokeStyle = '#8b6434'; ctx.lineWidth = 2;
  ctx.setLineDash([28,18]); ctx.beginPath();
  ctx.moveTo(0, H*0.775); ctx.lineTo(W, H*0.775); ctx.stroke();
  ctx.restore();

  // Trees
  var treeXs = [0.05,0.16,0.28,0.39,0.51,0.63,0.74,0.86,0.95];
  for (var ti = 0; ti < treeXs.length; ti++) {
    var tx = treeXs[ti]*W, th2 = 35 + (ti%3)*12;
    ctx.fillStyle = '#1a3a10';
    ctx.beginPath(); ctx.moveTo(tx,H*0.63-th2); ctx.lineTo(tx-11,H*0.63); ctx.lineTo(tx+11,H*0.63); ctx.fill();
    ctx.fillStyle = '#1e4a12';
    ctx.beginPath(); ctx.moveTo(tx,H*0.63-th2-8); ctx.lineTo(tx-8,H*0.63-th2+12); ctx.lineTo(tx+8,H*0.63-th2+12); ctx.fill();
  }

  var gY = H * 0.71; // ground line for characters

  // Hero x: left side, advances with progress
  var heroRatio = 0.06 + progCurrent * 0.5;
  var hx = heroRatio * W;
  if (shakeFrames > 0) { hx += Math.sin(shakeFrames * 1.1) * 7; shakeFrames--; }

  // Monster x: stays ahead, cornered on win
  var monRatio = isWin ? (0.7 + (1 - progCurrent) * 0.08) : (0.78 - progCurrent * 0.06);
  var mx = monRatio * W;
  var px = mx + 42; // princess behind monster

  // Bounce
  var hBounce = Math.abs(Math.sin(bounceT * 2)) * 9;
  var mBounce = Math.abs(Math.sin(bounceT * 2 + 1)) * 7;
  var pBounce = Math.abs(Math.sin(bounceT * 2 + 0.5)) * 5;

  // Draw monster
  ctx.font = '36px serif'; ctx.textAlign = 'center';
  ctx.fillText('👹', mx, gY - mBounce);

  // Draw princess
  ctx.font = '26px serif';
  ctx.fillText('👸', px, gY - pBounce - 2);

  // Draw hero on horse
  drawHorse(ctx, hx, gY - hBounce, bounceT);

  // Dust
  for (var d = 0; d < 3; d++) {
    var da = 0.28 - d * 0.07;
    ctx.fillStyle = 'rgba(180,140,80,' + da + ')';
    ctx.beginPath();
    ctx.ellipse(hx - 32 - d*14 + Math.sin(bounceT+d)*3, gY+3+d, 5-d, 2.5-d*0.4, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // Win: monster flees right off screen
  if (isWin && progCurrent > 0.88) {
    ctx.font = '22px serif';
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillText('💨', W * 0.97, gY - 16);
  }
}

function drawHorse(ctx, cx, cy, t) {
  var leg = Math.sin(t * 2.2) * 13;

  // Body
  ctx.fillStyle = '#8B5E3C';
  ctx.beginPath(); ctx.ellipse(cx, cy-13, 27, 15, 0, 0, Math.PI*2); ctx.fill();

  // Neck
  ctx.fillStyle = '#8B5E3C';
  ctx.beginPath(); ctx.moveTo(cx+15,cy-18); ctx.lineTo(cx+30,cy-18); ctx.lineTo(cx+27,cy-30); ctx.lineTo(cx+12,cy-22); ctx.fill();

  // Head
  ctx.fillStyle = '#7a5030';
  ctx.beginPath(); ctx.ellipse(cx+28, cy-23, 10, 8, -0.3, 0, Math.PI*2); ctx.fill();

  // Mane
  ctx.fillStyle = '#3d2200';
  ctx.beginPath(); ctx.ellipse(cx+20, cy-27, 4, 9, -0.3, 0, Math.PI*2); ctx.fill();

  // Eye
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(cx+32, cy-26, 2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx+33, cy-27, 0.8, 0, Math.PI*2); ctx.fill();

  // Tail
  ctx.save(); ctx.strokeStyle = '#3d2200'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx-25,cy-15);
  ctx.quadraticCurveTo(cx-38+Math.sin(t)*7, cy-2, cx-34+Math.sin(t*0.8)*9, cy+9);
  ctx.stroke(); ctx.restore();

  // Legs
  ctx.save(); ctx.strokeStyle = '#6b4020'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  var legPairs = [[cx+13,leg*0.5],[cx+19,-leg*0.5],[cx-13,-leg*0.5],[cx-19,leg*0.5]];
  for (var li = 0; li < legPairs.length; li++) {
    ctx.beginPath(); ctx.moveTo(legPairs[li][0], cy-1); ctx.lineTo(legPairs[li][0]+legPairs[li][1], cy+20); ctx.stroke();
  }
  ctx.restore();

  // Hooves
  ctx.fillStyle = '#222';
  for (var hi = 0; hi < legPairs.length; hi++) {
    ctx.beginPath(); ctx.ellipse(legPairs[hi][0]+legPairs[hi][1], cy+20, 4, 2, 0, 0, Math.PI*2); ctx.fill();
  }

  // Saddle
  ctx.fillStyle = '#8b2020';
  ctx.beginPath(); ctx.ellipse(cx-2, cy-27, 11, 5, 0, 0, Math.PI*2); ctx.fill();

  // Hero avatar
  if (heroCanvasImg.complete && heroCanvasImg.naturalWidth > 0) {
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy-42, 15, 0, Math.PI*2); ctx.clip();
    ctx.drawImage(heroCanvasImg, cx-15, cy-57, 30, 30);
    ctx.restore();
    ctx.strokeStyle = '#a78bfa'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy-42, 15, 0, Math.PI*2); ctx.stroke(); ctx.lineWidth = 1;
  } else {
    ctx.fillStyle = '#a78bfa'; ctx.beginPath(); ctx.arc(cx, cy-42, 15, 0, Math.PI*2); ctx.fill();
  }

  // Sword
  ctx.save(); ctx.strokeStyle = '#d0d0d0'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx+13, cy-40);
  ctx.lineTo(cx+25+Math.sin(t*2)*4, cy-58+Math.cos(t*2)*3);
  ctx.stroke();
  ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(cx+17,cy-47); ctx.lineTo(cx+21,cy-47); ctx.stroke();
  ctx.restore();
}

// ── ANIMATION LOOPS ──
function startChase() {
  cancelAnimationFrame(animId);
  var canvas = document.getElementById('chaseCanvas');
  function loop() { drawScene(canvas, false); animId = requestAnimationFrame(loop); }
  loop();
}

function startWinAnim() {
  cancelAnimationFrame(winAnimId);
  var canvas = document.getElementById('winCanvas');
  function loop() { drawScene(canvas, true); winAnimId = requestAnimationFrame(loop); }
  loop();
}
</script>
</body>
</html>
