<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nay có meeting k nào?</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(
        135deg,
        #ffd1dc,
        #ffe4ec,
        #ffc0cb
    );
}

.container {
    text-align: center;
    z-index: 10;
}

h1 {
    font-size: 4rem;
    color: #ff1493;
    margin-bottom: 50px;
    text-shadow: 2px 2px 10px rgba(255,255,255,0.8);
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
}

button {
    border: none;
    border-radius: 20px;
    padding: 15px 40px;
    font-size: 1.4rem;
    cursor: pointer;
    color: white;
    transition: transform 0.2s;
}

#vietBtn {
    background: #ff4fa3;
}

#trungBtn {
    background: #7b68ee;
}

#result {
    display: none;
    margin-top: 40px;
    font-size: 3rem;
    font-weight: bold;
    color: #ff1493;
}

#backBtn {
    display: none;
    margin-top: 25px;
    background: #ff69b4;
}

.heart {
    position: absolute;
    font-size: 30px;
    opacity: 0.7;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    from {
        transform: translateY(100vh);
    }
    to {
        transform: translateY(-120px);
    }
}
</style>

</head>

<body>

<div class="container">

<h1>💖 Nay có meeting k nào? 💖</h1>

<div class="buttons">
    <button id="vietBtn">Hong</button>
    <button id="trungBtn">Có</button>
</div>

<div id="result">
    💕 Tiếc quá phải skip r 💕
</div>

<button id="backBtn">
    ⬅ Quay lại
</button>

</div>

<script>

// Floating hearts
for(let i = 0; i < 30; i++) {

    const heart = document.createElement("div");

    heart.className = "heart";

    heart.innerHTML = Math.random() > 0.5 ? "💖" : "💕";

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.animationDuration =
        (5 + Math.random() * 8) + "s";

    document.body.appendChild(heart);
}

const vietBtn = document.getElementById("vietBtn");
const trungBtn = document.getElementById("trungBtn");
const result = document.getElementById("result");
const backBtn = document.getElementById("backBtn");
const buttons = document.querySelector(".buttons");

let clickCount = 0;
let scale = 1;

const texts = [
    "????",
    "Hoy mà 🤨",
    "Hong có j mới hết",
    "A Tùng bắt skip",
    "E cx muốn họp lắm 🥹",
    "Mn nhớ e à 💔"
];

// Có button runs away
trungBtn.addEventListener("click", () => {

    clickCount++;

    if(clickCount < texts.length) {
        trungBtn.textContent = texts[clickCount];
    }

    scale *= 0.88;
    trungBtn.style.transform = `scale(${scale})`;

    const maxX =
        window.innerWidth - trungBtn.offsetWidth;

    const maxY =
        window.innerHeight - trungBtn.offsetHeight;

    trungBtn.style.position = "fixed";

    trungBtn.style.left =
        Math.random() * maxX + "px";

    trungBtn.style.top =
        Math.random() * maxY + "px";
});

// Hong selected
vietBtn.addEventListener("click", () => {

    buttons.style.display = "none";

    result.style.display = "block";

    backBtn.style.display = "inline-block";

    confetti({
        particleCount: 300,
        spread: 180,
        origin: { y: 0.6 }
    });

    setTimeout(() => {
        confetti({
            particleCount: 200,
            spread: 120
        });
    }, 500);

    setTimeout(() => {
        confetti({
            particleCount: 150,
            spread: 100
        });
    }, 1000);
});

// Return button
backBtn.addEventListener("click", () => {

    result.style.display = "none";

    backBtn.style.display = "none";

    buttons.style.display = "flex";

    trungBtn.style.display = "inline-block";
    trungBtn.style.position = "static";
    trungBtn.style.left = "";
    trungBtn.style.top = "";
    trungBtn.style.transform = "scale(1)";
    trungBtn.textContent = "Có";

    clickCount = 0;
    scale = 1;
});

</script>

</body>
</html>
